<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniCalc - Scientific & Standard Calculator</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body data-theme="dark">
  <div class="app-container">
    <header class="app-header">
      <div class="brand">
        <span class="brand-icon">✦</span>
        <h1>OmniCalc</h1>
      </div>
      <div class="header-controls">
        <button id="mode-toggle-btn" class="icon-btn" title="Toggle Scientific Mode" aria-label="Toggle Scientific Mode">
          <span class="mode-badge">SCI</span>
        </button>
        <button id="history-toggle-btn" class="icon-btn" title="View History" aria-label="Toggle History">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        </button>
        <button id="theme-toggle-btn" class="icon-btn" title="Toggle Theme" aria-label="Toggle Theme">
          <svg id="theme-icon-dark" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
          <svg id="theme-icon-light" class="hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
        </button>
      </div>
    </header>

    <main class="calculator-card">
      <!-- Display Screen -->
      <div class="screen-container">
        <div class="indicators-row">
          <span id="memory-indicator" class="indicator hidden">M</span>
          <span id="angle-mode-indicator" class="indicator">DEG</span>
          <span id="mode-indicator" class="indicator">BASIC</span>
        </div>
        <div id="expression-display" class="expression-display" title="Current expression"></div>
        <div id="main-display" class="main-display" title="Current value">0</div>
      </div>

      <!-- Memory Row -->
      <div class="memory-bar">
        <button class="btn mem-btn" data-action="mc">MC</button>
        <button class="btn mem-btn" data-action="mr">MR</button>
        <button class="btn mem-btn" data-action="m-plus">M+</button>
        <button class="btn mem-btn" data-action="m-minus">M-</button>
        <button class="btn mem-btn" data-action="ms">MS</button>
      </div>

      <!-- Scientific Keyboard Panel (Collapsible) -->
      <div id="scientific-keypad" class="scientific-keypad collapsed">
        <button class="btn sci-btn" data-action="toggle-angle">Rad/Deg</button>
        <button class="btn sci-btn" data-action="sin">sin</button>
        <button class="btn sci-btn" data-action="cos">cos</button>
        <button class="btn sci-btn" data-action="tan">tan</button>
        <button class="btn sci-btn" data-action="pi">π</button>
        <button class="btn sci-btn" data-action="sqrt">√x</button>
        <button class="btn sci-btn" data-action="square">x²</button>
        <button class="btn sci-btn" data-action="power">xʸ</button>
        <button class="btn sci-btn" data-action="log">log₁₀</button>
        <button class="btn sci-btn" data-action="ln">ln</button>
        <button class="btn sci-btn" data-action="fact">n!</button>
        <button class="btn sci-btn" data-action="e">e</button>
        <button class="btn sci-btn" data-action="open-paren">(</button>
        <button class="btn sci-btn" data-action="close-paren">)</button>
        <button class="btn sci-btn" data-action="abs">|x|</button>
      </div>

      <!-- Primary Keypad -->
      <div class="keypad-grid">
        <button class="btn fn-btn" data-action="clear">AC</button>
        <button class="btn fn-btn" data-action="delete">⌫</button>
        <button class="btn fn-btn" data-action="percent">%</button>
        <button class="btn op-btn" data-operator="/">÷</button>

        <button class="btn num-btn" data-number="7">7</button>
        <button class="btn num-btn" data-number="8">8</button>
        <button class="btn num-btn" data-number="9">9</button>
        <button class="btn op-btn" data-operator="*">×</button>

        <button class="btn num-btn" data-number="4">4</button>
        <button class="btn num-btn" data-number="5">5</button>
        <button class="btn num-btn" data-number="6">6</button>
        <button class="btn op-btn" data-operator="-">−</button>

        <button class="btn num-btn" data-number="1">1</button>
        <button class="btn num-btn" data-number="2">2</button>
        <button class="btn num-btn" data-number="3">3</button>
        <button class="btn op-btn" data-operator="+">+</button>

        <button class="btn fn-btn" data-action="negate">±</button>
        <button class="btn num-btn" data-number="0">0</button>
        <button class="btn num-btn" data-number=".">.</button>
        <button class="btn eq-btn" data-action="equals">=</button>
      </div>
    </main>

    <!-- History Drawer / Overlay -->
    <aside id="history-panel" class="history-panel hidden">
      <div class="history-header">
        <h3>History</h3>
        <div class="history-actions">
          <button id="clear-history-btn" class="text-btn">Clear</button>
          <button id="close-history-btn" class="icon-btn" aria-label="Close History">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </button>
        </div>
      </div>
      <div id="history-list" class="history-list">
        <p class="empty-history-msg">There's no calculation history yet.</p>
      </div>
    </aside>
  </div>

  <script src="app.js"></script>
</body>
</html>
